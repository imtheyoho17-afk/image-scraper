<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Scraper</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { width: 100%; max-width: 640px; padding: 20px; }
        .card {
            background: #12121a;
            border: 1px solid #1e1e2e;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .logo p { color: #666; font-size: 14px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 24px; }
        input[type="url"] {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #1e1e2e;
            border-radius: 12px;
            background: #0a0a0f;
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="url"]:focus { border-color: #667eea; }
        input[type="url"]::placeholder { color: #444; }
        button {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102,126,234,0.4); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-download {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: white;
            font-size: 17px;
            margin-top: 16px;
        }
        .btn-download:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,184,148,0.4); }
        .progress-section { display: none; }
        .progress-section.active { display: block; }
        .status-text { font-size: 14px; color: #888; margin-bottom: 12px; min-height: 20px; }
        .progress-bar-container {
            width: 100%; height: 8px;
            background: #1e1e2e;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.5s ease;
            width: 0%;
        }
        .progress-percentage { text-align: right; font-size: 13px; color: #667eea; font-weight: 600; }
        .stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 20px;
            padding: 16px;
            background: #0a0a0f;
            border-radius: 10px;
        }
        .stat { text-align: center; }
        .stat-value { font-size: 24px; font-weight: 700; color: #667eea; }
        .stat-label { font-size: 12px; color: #555; margin-top: 4px; }
        .error {
            color: #ff6b6b;
            background: rgba(255,107,107,0.1);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }
        .error.active { display: block; }
        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .checkmark { color: #00b894; font-size: 48px; text-align: center; margin-bottom: 16px; }
        .phase-indicator { display: flex; justify-content: space-between; margin-bottom: 20px; padding: 0 10px; }
        .phase { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .phase-dot { width: 10px; height: 10px; border-radius: 50%; background: #1e1e2e; transition: all 0.3s; }
        .phase-dot.active { background: #667eea; box-shadow: 0 0 10px rgba(102,126,234,0.5); }
        .phase-dot.done { background: #00b894; }
        .phase-label { font-size: 11px; color: #444; transition: color 0.3s; }
        .phase-label.active { color: #667eea; }
        .phase-label.done { color: #00b894; }
        .footer { text-align: center; margin-top: 24px; font-size: 12px; color: #333; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="logo">
            <h1>🖼️ Image Scraper</h1>
            <p>Paste a URL → Get all images in highest quality → Download as ZIP</p>
        </div>

        <div id="inputSection">
            <div class="input-group">
                <input type="url" id="urlInput" placeholder="https://example.com/gallery" autocomplete="off"/>
                <button class="btn-primary" id="scrapeBtn" onclick="startScrape()">Scrape</button>
            </div>
        </div>

        <div class="error" id="errorBox"></div>

        <div class="progress-section" id="progressSection">
            <div class="phase-indicator">
                <div class="phase">
                    <div class="phase-dot" id="phase1Dot"></div>
                    <span class="phase-label" id="phase1Label">Load</span>
                </div>
                <div class="phase">
                    <div class="phase-dot" id="phase2Dot"></div>
                    <span class="phase-label" id="phase2Label">Collect</span>
                </div>
                <div class="phase">
                    <div class="phase-dot" id="phase3Dot"></div>
                    <span class="phase-label" id="phase3Label">Download</span>
                </div>
                <div class="phase">
                    <div class="phase-dot" id="phase4Dot"></div>
                    <span class="phase-label" id="phase4Label">ZIP</span>
                </div>
            </div>
            <div class="status-text" id="statusText"><span class="spinner"></span> Starting...</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-percentage" id="progressPercent">0%</div>
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="statFound">0</div>
                    <div class="stat-label">Found</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="statDownloaded">0</div>
                    <div class="stat-label">Downloaded</div>
                </div>
            </div>
        </div>

        <div id="doneSection" style="display:none;">
            <div class="checkmark">✅</div>
            <div style="text-align:center; margin-bottom:8px; font-size:18px; font-weight:600;">All done!</div>
            <div style="text-align:center; color:#666; font-size:14px;" id="doneSummary"></div>
            <button class="btn-download" onclick="downloadZip()">⬇️ Download ZIP</button>
            <button class="btn-primary" style="width:100%; margin-top:10px; background:#1e1e2e;" onclick="resetUI()">
                Scrape Another Page
            </button>
        </div>
    </div>
    <div class="footer">Clicks thumbnails automatically to find full resolution versions</div>
</div>

<script>
    let currentJobId = null;
    let pollInterval = null;

    function startScrape() {
        const url = document.getElementById('urlInput').value.trim();
        if (!url) { showError('Please enter a URL'); return; }
        try { new URL(url); } catch { showError('Please enter a valid URL (include https://)'); return; }

        hideError();
        document.getElementById('scrapeBtn').disabled = true;
        document.getElementById('scrapeBtn').innerHTML = '<span class="spinner"></span> Starting...';

        fetch('/api/scrape', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url })
        })
        .then(res => res.json())
        .then(data => {
            if (data.error) { showError(data.error); resetBtn(); return; }
            currentJobId = data.jobId;
            showProgress();
            pollStatus();
        })
        .catch(err => { showError('Failed to start: ' + err.message); resetBtn(); });
    }

    function pollStatus() {
        pollInterval = setInterval(async () => {
            try {
                const res = await fetch(`/api/status/${currentJobId}`);
                const data = await res.json();
                updateProgress(data);
                if (data.status === 'done') { clearInterval(pollInterval); showDone(data); }
                else if (data.status === 'error') { clearInterval(pollInterval); showError(data.message); resetBtn(); }
            } catch (err) { console.error(err); }
        }, 1000);
    }

    function updateProgress(data) {
        document.getElementById('progressBar').style.width = data.progress + '%';
        document.getElementById('progressPercent').textContent = data.progress + '%';
        document.getElementById('statusText').innerHTML = '<span class="spinner"></span> ' + data.message;
        document.getElementById('statFound').textContent = data.totalImages;
        document.getElementById('statDownloaded').textContent = data.downloadedImages;

        const phases = { starting:1, launching_browser:1, loading_page:1, collecting:2, downloading:3, zipping:4, done:5 };
        const currentPhase = phases[data.status] || 0;

        for (let i = 1; i <= 4; i++) {
            const dot = document.getElementById(`phase${i}Dot`);
            const label = document.getElementById(`phase${i}Label`);
            dot.className = 'phase-dot';
            label.className = 'phase-label';
            if (i < currentPhase) { dot.classList.add('done'); label.classList.add('done'); }
            else if (i === currentPhase) { dot.classList.add('active'); label.classList.add('active'); }
        }
    }

    function showProgress() {
        document.getElementById('progressSection').classList.add('active');
        document.getElementById('inputSection').style.display = 'none';
        document.getElementById('doneSection').style.display = 'none';
    }

    function showDone(data) {
        document.getElementById('progressSection').classList.remove('active');
        document.getElementById('doneSection').style.display = 'block';
        document.getElementById('doneSummary').textContent = `${data.downloadedImages} images packaged into a ZIP file.`;
    }

    function downloadZip() { window.location.href = `/api/download/${currentJobId}`; }

    function resetUI() {
        document.getElementById('inputSection').style.display = 'block';
        document.getElementById('progressSection').classList.remove('active');
        document.getElementById('doneSection').style.display = 'none';
        document.getElementById('urlInput').value = '';
        resetBtn();
        currentJobId = null;
        hideError();
    }

    function resetBtn() {
        document.getElementById('scrapeBtn').disabled = false;
        document.getElementById('scrapeBtn').textContent = 'Scrape';
    }

    function showError(msg) {
        const el = document.getElementById('errorBox');
        el.textContent = msg;
        el.classList.add('active');
    }

    function hideError() { document.getElementById('errorBox').classList.remove('active'); }

    document.getElementById('urlInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') startScrape();
    });
</script>
</body>
                  </html>
